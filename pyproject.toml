[project]
name = "splitstitch"
version = "0.1.0"
description = "Split & Stitch for QuickMagicMotion - Optimization, Splitting, and High-Precision Motion Stitching Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    "pyside6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
splitstitch = "splitstitch.cli.main:app"
quickpipeline = "splitstitch.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitstitch"]
